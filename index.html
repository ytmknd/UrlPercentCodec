<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>URL Encoder / Decoder</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --text: #1f2430; --muted: #6b7280;
    --border: #d5d9e0; --accent: #2563eb; --accent-text: #fff; --err: #dc2626;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161b; --card: #1d2027; --text: #e6e8ec; --muted: #9aa1ad;
      --border: #333843; --accent: #3b82f6; --err: #f87171;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 16px; background: var(--bg); color: var(--text);
    font-family: system-ui, "Hiragino Sans", "Yu Gothic UI", Meiryo, sans-serif;
  }
  main { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin: 0 0 16px; }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; padding: 16px; margin-bottom: 16px;
  }
  label.title { display: block; font-weight: 600; margin-bottom: 8px; }
  textarea {
    width: 100%; min-height: 120px; resize: vertical; padding: 10px;
    border: 1px solid var(--border); border-radius: 6px;
    background: transparent; color: inherit;
    font: 0.95rem/1.5 ui-monospace, Consolas, "Courier New", monospace;
  }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
  button {
    padding: 8px 16px; border: 1px solid var(--border); border-radius: 6px;
    background: transparent; color: inherit; font: inherit; cursor: pointer;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  button:hover { filter: brightness(0.95); }
  .spacer { flex: 1; }
  #msg { min-height: 1.4em; font-size: 0.9rem; color: var(--muted); }
  #msg.err { color: var(--err); }
</style>
</head>
<body>
<main>
  <h1 data-i18n="heading"></h1>

  <div class="card">
    <label class="title" for="input" data-i18n="input"></label>
    <textarea id="input" spellcheck="false" data-i18n-placeholder="placeholder"></textarea>
    <div class="row">
      <button class="primary" id="enc" data-i18n="encode"></button>
      <button class="primary" id="dec" data-i18n="decode"></button>
      <span class="spacer"></span>
      <button id="clear" data-i18n="clear"></button>
    </div>
  </div>

  <div class="card">
    <label class="title" for="output" data-i18n="result"></label>
    <textarea id="output" readonly spellcheck="false"></textarea>
    <div class="row">
      <button id="copy" data-i18n="copy"></button>
      <button id="swap" data-i18n="swap"></button>
      <span id="msg" role="status"></span>
    </div>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const input = $('input'), output = $('output'), msg = $('msg');

const MESSAGES = {
  ja: {
    heading: 'URL エンコード変換',
    input: '入力(日本語を含むURL / %XX形式のURL)',
    placeholder: '例: https://ja.wikipedia.org/wiki/日本語',
    encode: 'エンコード(日本語 → %XX)',
    decode: 'デコード(%XX → 日本語)',
    clear: 'クリア',
    result: '結果',
    copy: 'コピー',
    swap: '結果を入力に移す',
    empty: '入力が空です',
    encoded: 'エンコードしました',
    decoded: 'デコードしました',
    nothingToDecode: '%XX が含まれていないため、変換されませんでした',
    decodeFailed: 'デコードできません(%XX の形式が不正、またはUTF-8ではありません)',
    nothingToCopy: 'コピーする結果がありません',
    copied: 'コピーしました',
  },
  en: {
    heading: 'URL Encoder / Decoder',
    input: 'Input (URL containing non-ASCII text, or a %XX-encoded URL)',
    placeholder: 'e.g. https://ja.wikipedia.org/wiki/日本語',
    encode: 'Encode (text → %XX)',
    decode: 'Decode (%XX → text)',
    clear: 'Clear',
    result: 'Result',
    copy: 'Copy',
    swap: 'Move result to input',
    empty: 'Input is empty',
    encoded: 'Encoded',
    decoded: 'Decoded',
    nothingToDecode: 'No %XX sequences found; nothing was converted',
    decodeFailed: 'Cannot decode (malformed %XX sequence, or the data is not UTF-8)',
    nothingToCopy: 'Nothing to copy',
    copied: 'Copied',
  },
};

const lang = (navigator.language || '').toLowerCase().startsWith('ja') ? 'ja' : 'en';
const t = (key) => MESSAGES[lang][key];

document.documentElement.lang = lang;
document.title = t('heading');
document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = t(el.dataset.i18n); });
document.querySelectorAll('[data-i18n-placeholder]').forEach((el) => { el.placeholder = t(el.dataset.i18nPlaceholder); });

function say(key, isErr = false) {
  msg.textContent = key ? t(key) : '';
  msg.className = isErr ? 'err' : '';
}

$('enc').onclick = () => {
  if (!input.value) return say('empty', true);
  // URLの区切り文字(: / ? & = # など)は残し、日本語等だけを %XX に変換する
  output.value = encodeURI(input.value);
  say('encoded');
};

$('dec').onclick = () => {
  const text = input.value.trim();
  if (!text) return say('empty', true);
  try {
    output.value = decodeURIComponent(text);
    say(/%[0-9A-Fa-f]{2}/.test(text) ? 'decoded' : 'nothingToDecode');
  } catch {
    output.value = '';
    say('decodeFailed', true);
  }
};

$('copy').onclick = async () => {
  if (!output.value) return say('nothingToCopy', true);
  try {
    await navigator.clipboard.writeText(output.value);
    say('copied');
  } catch {
    output.select();
    document.execCommand('copy');
    say('copied');
  }
};

$('swap').onclick = () => {
  input.value = output.value;
  output.value = '';
  say('');
};

$('clear').onclick = () => {
  input.value = output.value = '';
  say('');
  input.focus();
};
</script>
</body>
</html>
